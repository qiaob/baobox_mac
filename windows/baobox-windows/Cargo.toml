[package]
name = "baobox-windows"
version = "0.1.0"
edition = "2021"
description = "Baobox Windows 实现：GDI 抓屏与截图 CLI"
license = "MIT"

[dependencies]
baobox-core = { path = "../../shared/baobox-core" }
baobox-app = { path = "../../shared/baobox-app" }
baobox-image = { path = "../../shared/baobox-image" }
baobox-render = { path = "../../shared/baobox-render" }

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf = { version = "1.4", features = ["names", "KHR_materials_unlit"] }
glam = "0.30"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security_Cryptography",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
