name: Release

# 推 vX.Y.Z 标签触发：三个平台各自编译打包，最后一个 publish 统一发到同一个 GitHub Release（#112）：
# - Baobox-X.Y.Z.zip                     macOS（ad-hoc 签名，见下）
# - Baobox-X.Y.Z-linux-x86_64.tar.gz     Linux 可执行文件（tar 保留可执行位）
# - Baobox-X.Y.Z-windows-x86_64.zip      Windows 可执行文件
# Mac 包必须有；Linux / Windows 哪个没编过就先不挂它，不挡 Mac 发版（Actions 页面会标红，修好后可重跑）。
# Rust 两边的版本号同样取自标签：编译前把 Cargo.toml 的 version 改成 X.Y.Z，「关于」里显示的就是它。
#
# 无付费开发者账号（无 Developer ID 证书、无法公证），所以产物是 **ad-hoc 签名**：
# - 他人下载后首次打开需右键 →「打开」绕过 Gatekeeper；
# - ad-hoc 的 cdhash 每次构建都变，覆盖安装会作废屏幕录制/辅助功能等 TCC 授权 ——
#   自己的 Mac 上优先装本地 Xcode 构建（开发证书签名，授权稳定），此产物主要给分发用。
# 将来有付费账号后，恢复 git 历史里带证书导入 + notarytool 公证的版本即可。
#
# 版本号以标签为唯一事实来源：Info.plist 里的 CFBundleShortVersionString /
# CFBundleVersion 写的是 $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION)，
# 所以下面在命令行上覆盖这两个构建设置就能真的改到包里的版本号。
# （写死字面量的话覆盖是不起作用的 —— 这曾经是个真实的 bug。）
on:
  push:
    tags:
      - "v*"
  # 手动试跑：三个平台照样编译、打包，产物留在这次运行的 Artifacts 里，**不发布**（publish 只在推标签时跑）。
  workflow_dispatch:
    inputs:
      version:
        description: "试打包用的版本号（不发布）"
        default: "0.0.0-dryrun"

permissions:
  contents: write

jobs:
  macos:
    # Xcode 26：实时翻译的 SpeechAnalyzer 新引擎只有新 SDK 才编得进去（macOS 26 上更快更准）。
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Derive version from tag
        id: version
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Generate project
        run: xcodegen generate

      # 下载好的 llama.cpp + 编好的虚拟麦克风驱动按 Makefile 内容缓存：版本不变就不再访问 GitHub 的下载服务
      # （它偶尔连续 504，曾让整条构建卡在这一步、代码根本没编）。只在两样都齐了时才存缓存。
      - name: Restore vendored helpers
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: mac/Vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mac/Makefile') }}

      # 离线翻译的推理进程（llama.cpp 官方预编译包）+「Baobox 同传」虚拟麦克风驱动（BlackHole 源码改名编译），
      # 版本与 SHA-256 固定在 mac/Makefile。构建时由 project.yml 的脚本阶段拷进 App
      # （没有它们 App 也能编，只是离线模型 / 送会议不可用）。
      - name: Vendor llama.cpp and audio driver
        id: vendor
        run: |
          make vendor
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Save vendored helpers
        if: steps.vendor.outputs.complete == 'true' && steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mac/Vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mac/Makefile') }}

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -project Baobox.xcodeproj -scheme Baobox -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            build

      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          ditto -c -k --keepParent "$RUNNER_TEMP/build/Baobox.app" \
            "$RUNNER_TEMP/dist/Baobox-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GTK 是设置窗口用的（C 库，必须装开发包）；同 build-linux.yml。
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        id: version
        working-directory: linux/baobox-linux
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          version="${tag#v}"
          sed -i -E "0,/^version = \".*\"/s//version = \"${version}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release (warnings are errors)
        working-directory: linux/baobox-linux
        run: cargo rustc --release -- -D warnings

      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          tar -C linux/baobox-linux/target/release -czf \
            "$RUNNER_TEMP/dist/Baobox-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" baobox-linux

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version from tag
        id: version
        working-directory: windows/baobox-windows
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          version="${tag#v}"
          sed -i -E "0,/^version = \".*\"/s//version = \"${version}\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release (warnings are errors)
        working-directory: windows/baobox-windows
        run: cargo rustc --release -- -D warnings

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/dist" | Out-Null
          Compress-Archive -Path windows/baobox-windows/target/release/baobox-windows.exe `
            -DestinationPath "$env:RUNNER_TEMP/dist/Baobox-${{ steps.version.outputs.version }}-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    # Mac 包是必须的；Linux / Windows 没编过就只发已有的（见文件头）。
    needs: [macos, linux, windows]
    if: ${{ !cancelled() && needs.macos.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ls -l dist
          # 同名 Release 已存在（比如本地手动先发了）就只补传产物，不重复创建。
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Baobox $tag" --generate-notes
          fi
