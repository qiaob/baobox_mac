name: Release

# 推 vX.Y.Z 标签触发：编译 Release → ad-hoc 签名 → 打包 → 发布到 GitHub Releases。
#
# 无付费开发者账号（无 Developer ID 证书、无法公证），所以产物是 **ad-hoc 签名**：
# - 他人下载后首次打开需右键 →「打开」绕过 Gatekeeper；
# - ad-hoc 的 cdhash 每次构建都变，覆盖安装会作废屏幕录制/辅助功能等 TCC 授权 ——
#   自己的 Mac 上优先装本地 Xcode 构建（开发证书签名，授权稳定），此产物主要给分发用。
# 将来有付费账号后，恢复 git 历史里带证书导入 + notarytool 公证的版本即可。
#
# 版本号以标签为唯一事实来源，运行时覆盖 project.yml 里的值，不需要每次发版改文件。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Generate project
        run: xcodegen generate

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -project Baobox.xcodeproj -scheme Baobox -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            build

      - name: Package
        id: package
        run: |
          ZIP_NAME="Baobox-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/build/Baobox.app" "$ZIP_NAME"
          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同名 Release 已存在（比如本地手动先发了）就只补传产物，不重复创建。
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.package.outputs.zip }}" --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              "${{ steps.package.outputs.zip }}" \
              --title "Baobox ${{ steps.version.outputs.tag }}" \
              --generate-notes
          fi
