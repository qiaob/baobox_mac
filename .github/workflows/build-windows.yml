name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "windows/**"
      - "shared/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared/baobox-core
            shared/baobox-app
            shared/baobox-render
            shared/baobox-image
            windows/baobox-windows

      # 共享层也在 Windows 上跑一遍（#115）：以前只在 Linux 上跑，路径分隔符、换行这类平台差异测不到。
      - name: Test shared crates
        shell: bash
        run: |
          for crate in shared/baobox-core shared/baobox-app shared/baobox-render shared/baobox-image; do
            echo "== $crate"
            (cd "$crate" && cargo test --all-targets)
          done

      # 这一步是这条流水线最有价值的地方：覆盖层、标注编辑器、托盘、
      # 设置窗口那些测试都带 `cfg(windows)`，在开发机上只能类型检查，
      # **只有在真 Windows 上才真正跑得起来**。
      - name: Test
        working-directory: windows/baobox-windows
        run: cargo test --all-targets

      # 用 `cargo rustc -- -D warnings` 而不是 `RUSTFLAGS`：
      # 后者会一并作用到所有第三方依赖上，别人代码里的一个 warning
      # 就能把我们的流水线弄红。
      - name: Build release (warnings are errors)
        working-directory: windows/baobox-windows
        run: cargo rustc --release -- -D warnings

      - uses: actions/upload-artifact@v4
        with:
          name: baobox-windows-x86_64
          path: windows/baobox-windows/target/release/baobox-windows.exe
          if-no-files-found: error

  # 风格与 lint（#115）：rustfmt 不合格、clippy 有任何警告都算失败。工具链固定版本，理由同 build-linux.yml。
  lint:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: windows/baobox-windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            windows/baobox-windows

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
