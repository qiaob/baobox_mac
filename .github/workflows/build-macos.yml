name: Build macOS

# 手动触发，或推到 main / claude 分支时自动跑。
# 产物是一个可以直接下载安装的 .app（ad-hoc 签名）——
# 首次打开需要右键 →「打开」绕过 Gatekeeper，理由见 release.yml 的说明。
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "mac/**"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    # 两套工具链都要过：Xcode 26 编进实时翻译的 SpeechAnalyzer 新引擎（#if compiler(>=6.2)），
    # Xcode 16.2 验证没有新 SDK 的机器照样编得过（走旧引擎）。只有 Xcode 26 那份上传产物。
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: "26"
            upload: true
          # macos-14 的 runner 镜像 2026-11 已下线（任务直接被取消：configuration not supported）；
          # macos-15 镜像仍装着 Xcode 16.2（16C5032a），与本机开发用的版本一致。
          - runner: macos-15
            xcode: "16.2"
            upload: false
    name: build (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # 下载好的 llama.cpp + 编好的虚拟麦克风驱动按 Makefile 内容缓存：版本不变就不再访问 GitHub 的下载服务
      # （它偶尔连续 504，曾让整条构建卡在这一步、代码根本没编）。只在两样都齐了时才存缓存。
      - name: Restore vendored helpers
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: mac/Vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mac/Makefile') }}

      # 离线翻译的推理进程（llama.cpp 官方预编译包）+「Baobox 同传」虚拟麦克风驱动（BlackHole 源码改名编译），
      # 版本与 SHA-256 固定在 mac/Makefile。构建时由 project.yml 的脚本阶段拷进 App
      # （没有它们 App 也能编，只是离线模型 / 送会议不可用）。
      - name: Vendor llama.cpp and audio driver
        id: vendor
        # 这条流水线是用来验证代码能编过的：下载失败只告警、继续编（App 缺了它们照样能编，
        # 只是离线模型 / 送会议不可用）。发版流水线（release.yml）仍然严格，缺了就失败。
        run: |
          if make -k vendor; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::make vendor failed (download error?) — building without the offline-translation helper / virtual mic; this artifact lacks them"
          fi

      - name: Save vendored helpers
        if: steps.vendor.outputs.complete == 'true' && steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mac/Vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mac/Makefile') }}

      # ad-hoc 签名（CODE_SIGN_IDENTITY="-"）：CI runner 上没有开发团队的凭据，
      # 但产物要能真的跑起来，所以不能用 CODE_SIGNING_ALLOWED=NO ——
      # 那样出来的 .app 在别人机器上一打开就被系统杀掉。
      #
      # DEVELOPMENT_TEAM 必须显式清空：project.yml 里写着团队 ID，
      # 留着的话 Xcode 会去解析该团队的自动签名配置，在没有凭据的 runner 上会失败。
      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -project Baobox.xcodeproj -scheme Baobox -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            build

      - name: Package
        if: matrix.upload
        run: |
          cd "$RUNNER_TEMP/build"
          ditto -c -k --keepParent Baobox.app Baobox-macos.zip

      # 上传 zip 而不是 .app 目录：GitHub 的 artifact 打包会丢掉符号链接与
      # 可执行位，.app 下载下来就打不开了。自己先 ditto 成 zip 可以避开。
      - uses: actions/upload-artifact@v4
        if: matrix.upload
        with:
          name: Baobox-macos
          path: ${{ runner.temp }}/build/Baobox-macos.zip
          if-no-files-found: error
