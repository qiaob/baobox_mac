<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Baobox 互传</title>
<style>
  :root {
    --bg: #F5F6F7; --card: #FFFFFF; --text: #1C1C1E; --sub: #6B6F76; --line: #E3E5E8;
    --accent: #17A398; --accent-text: #FFFFFF; --danger: #D93A3A; --warn-bg: #FFF6E0; --warn: #8A6100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --card: #1C1D20; --text: #F2F2F4; --sub: #9A9EA6; --line: #2C2E33;
      --accent: #2BC4B8; --accent-text: #08201E; --danger: #FF6B6B; --warn-bg: #2E2715; --warn: #E8C26A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  h1 { font-size: 20px; margin: 0; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--line); color: var(--sub); white-space: nowrap; }
  .pill.ok { background: var(--accent); color: var(--accent-text); }
  .pill.bad { background: var(--danger); color: #fff; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: var(--sub); font-weight: 600; }
  .hidden { display: none !important; }
  button, .btn { appearance: none; border: 0; border-radius: 10px; padding: 12px 16px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-text); cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
  button.secondary, .btn.secondary { background: var(--line); color: var(--text); }
  button:disabled { opacity: .5; }
  .wide { width: 100%; }
  textarea { width: 100%; min-height: 72px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); padding: 10px; font: inherit; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row > * { flex: 1; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  ul.list li:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--sub); }
  .textbody { white-space: pre-wrap; word-break: break-word; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .small { padding: 8px 12px; font-size: 14px; }
  .empty { color: var(--sub); font-size: 14px; }
  .note { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .center { text-align: center; padding: 28px 16px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    margin: 0 auto 14px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error h2 { color: var(--danger); }
  #error ul { margin: 8px 0 0; padding-left: 20px; }
  .picks { margin: 0 0 10px; }
  /* 看大图：长按图片存相册，所以不能禁用 -webkit-touch-callout / pointer-events。 */
  .viewer { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .viewer img { max-width: 100%; max-height: 72vh; object-fit: contain; border-radius: 6px; }
  .viewer-text { color: #E6E6E6; font-size: 14px; text-align: center; }
  .viewer-actions { display: flex; gap: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title">Baobox 互传</h1>
    <span id="status" class="pill"></span>
  </header>

  <div id="note" class="note hidden"></div>

  <section id="wait" class="card center">
    <div class="spinner"></div>
    <div id="wait-text"></div>
  </section>

  <section id="error" class="card hidden">
    <h2 id="error-title"></h2>
    <div id="error-detail"></div>
    <ul id="error-tips"></ul>
  </section>

  <div id="main" class="hidden">
    <section class="card">
      <h2 data-i18n="sendTitle"></h2>
      <input id="image-input" type="file" accept="image/*" multiple class="hidden">
      <input id="file-input" type="file" multiple class="hidden">
      <div class="row picks">
        <button id="pick-images" data-i18n="pickImages"></button>
        <button id="pick" data-i18n="pickFiles"></button>
      </div>
      <textarea id="text-input" data-i18n-placeholder="textPlaceholder"></textarea>
      <div class="row"><button id="send-text" class="secondary" data-i18n="sendText"></button></div>
      <ul id="out-list" class="list" style="margin-top:10px"></ul>
    </section>

    <section class="card">
      <h2 data-i18n="fromMac"></h2>
      <ul id="in-list" class="list"></ul>
      <div id="in-empty" class="empty" data-i18n="nothingYet"></div>
    </section>
  </div>
</main>
<div id="viewer" class="viewer hidden" role="dialog" aria-modal="true">
  <img id="viewer-img" alt="">
  <div id="viewer-hint" class="viewer-text hidden" data-i18n="saveHint"></div>
  <div id="viewer-msg" class="viewer-text hidden" data-i18n="noPreview"></div>
  <div class="viewer-actions">
    <a id="viewer-save" class="btn secondary"></a>
    <button id="viewer-close" data-i18n="close"></button>
  </div>
</div>
<script src="rtc.js"></script>
<script src="phone.js"></script>
</body>
</html>
