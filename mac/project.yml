name: Baobox
options:
  bundleIdPrefix: com.baobox
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Baobox:
    type: application
    platform: macOS
    # 共享的 Baobox scheme：Test 动作跑 BaoboxTests（`xcodebuild test -scheme Baobox`）。
    scheme:
      testTargets:
        - BaoboxTests
    sources:
      - path: Sources
        excludes:
          - "Resources/Pets"
          - "Resources/PhoneTransfer"
          # 网络抓包（NetCapture）暂缓发布（#103）：里面有 MITM 代理和自签 CA，没注册也不该编进发布包，代码先留在仓库。
          # 恢复时：删掉这一行；AppDelegate 里取消 `registry.register(NetCaptureTool())` 的注释；
          # NSLocalNetworkUsageDescription 补回「网络抓包」；按 docs/packet-capture/ 重新过一遍安全评审（CA 私钥存放、代理只听本机）。
          - "Modules/NetCapture"
      # 内置宠物形象：整个文件夹原样拷进 Resources/Pets/<形象>/（每个形象都有自己的 pet.json，
      # 按普通资源平铺会同名冲突）。见 docs/desktop-pet/PACKS.md。
      - path: Sources/Resources/Pets
        type: folder
        buildPhase: resources
      # 手机互传的网页（手机页 + 公网模式共享层 + Mac 宿主页）：整个文件夹拷进 Resources/PhoneTransfer/，
      # 局域网服务直接读它，GitHub Pages 工作流也从这里发布。见 docs/phone-transfer/TECH_DESIGN.md。
      - path: Sources/Resources/PhoneTransfer
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Baobox
        # 从构建设置取值，别写死 —— 写死的话发版流程在命令行上覆盖
        # MARKETING_VERSION 就完全不起作用，v0.0.7 的包里仍写着 0.0.6。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© 2026 Baobox"
        NSMicrophoneUsageDescription: "录屏时录制你的声音（可选开启）、会议记录与实时翻译转写你说的话，以及语音听写把你说的话转成文字。Used to record your voice during screen recording (optional), to transcribe what you say in meeting recordings and Live Translate, and for Dictation."
        # 会议记录、实时翻译、语音听写用 Speech 框架做语音识别；缺这条描述，首次请求授权时进程会被系统直接杀掉。
        NSSpeechRecognitionUsageDescription: "会议记录、实时翻译与语音听写需要把语音转成文字（优先在本机识别）。Meeting recording, Live Translate and Dictation convert speech into text (on this Mac when possible)."
        NSAppleEventsUsageDescription: "用于把已在运行的 Claude Code 会话所在的终端窗口切换到前台。Used to bring the terminal window hosting a running Claude Code session to the front."
        NSLocalNetworkUsageDescription: "手机互传需要使用局域网，让同一 Wi-Fi 下的手机连接这台 Mac。Phone Transfer uses the local network so phones on the same Wi-Fi can connect to this Mac."
        # 会议读本机日历（只读、数据不出本机）：下一场会议、会前提醒、一键入会、会议绑定日历事件。
        # 缺这条描述，申请日历权限时进程会被系统直接杀掉。
        NSCalendarsFullAccessUsageDescription: "会议需要读取你选中的日历，用来显示下一场会议、会前提醒、一键入会，并把会议记录与日历事件对应起来；只读，数据不出本机。Meeting reads the calendars you choose to show your next meeting, remind you before it starts, join it in one click and link recordings to calendar events. Read-only; nothing leaves this Mac."
    # Hardened Runtime 下访问麦克风必须显式声明 audio-input entitlement，
    # 只有 Info.plist 的用途描述是不够的。
    # 同理,向 iTerm2 / Terminal 发送 AppleScript(按 tty 选中会话标签页)
    # 需要 automation.apple-events entitlement；会议读日历（EventKit）需要 personal-information.calendars，
    # 缺了系统直接拒绝、连授权框都不弹。
    entitlements:
      path: Baobox.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baobox.app
        MARKETING_VERSION: "0.0.8"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # 固定签名身份：ad-hoc 签名的 cdhash 每次重新编译都会变，macOS TCC 会因此
        # 判定为"另一个 App"并作废已授予的屏幕录制/辅助功能权限。绑定开发团队后
        # 签名身份稳定，重新编译不再掉权限。
        DEVELOPMENT_TEAM: JD2ZQL6YU2
        ENABLE_HARDENED_RUNTIME: true
        DEAD_CODE_STRIPPING: true
        # 唯一的 Objective-C：接住系统 API 抛的 Objective-C 异常（Swift 接不住，进程直接崩），见 Core/ObjC/BBXObjC.h。
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/ObjC/Baobox-Bridging-Header.h
        # 下面的脚本阶段要写 Contents/Helpers，不能跑在脚本沙盒里。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 离线翻译的推理进程（docs/translation-engine/DESIGN.md §2.2）：把 `make vendor` 下载的
    # Vendor/llama 拷进 Contents/Helpers/llama，并用 App 同一身份逐个签名（嵌套代码要先于 App 本身签名，
    # Xcode 的 CodeSign 步骤在所有脚本阶段之后）。不开 Hardened Runtime：ad-hoc 构建下库校验会拒载 dylib。
    # 没有 Vendor 就跳过 —— App 照常可用，离线模型在设置里显示为不可用。
    postBuildScripts:
      - name: Embed llama-server
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${SRCROOT}/Vendor/llama"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/llama"
          if [ ! -x "${SRC}/llama-server" ]; then
            echo "warning: ${SRC}/llama-server not found, offline translation helper not embedded (run: make vendor)"
            exit 0
          fi
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp "${SRC}/llama-server" "${SRC}"/*.dylib "${DEST}/"
          # 许可证不是代码，放进 Resources（Helpers 下只能放已签名的代码）。
          cp "${SRC}/LICENSE" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/llama.cpp-LICENSE.txt"
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ]; then
            IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
            for f in "${DEST}"/*.dylib "${DEST}/llama-server"; do
              /usr/bin/codesign --force --sign "${IDENTITY}" --timestamp=none "$f"
            done
          fi
      # 「Baobox 同传」虚拟麦克风驱动（docs/live-translate-voice/DESIGN.md §3）：把 `make vendor` 编出来的
      # Vendor/audio-driver/BaoboxInterpreter.driver 拷进 Contents/Library/Audio/ 并用 App 同一身份签名；
      # 用户在设置里点「安装」才装进系统。没有就跳过 —— 照样能用别的虚拟声卡（如 BlackHole）。
      - name: Embed audio driver
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${SRCROOT}/Vendor/audio-driver"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/Audio"
          if [ ! -d "${SRC}/BaoboxInterpreter.driver" ]; then
            echo "warning: ${SRC}/BaoboxInterpreter.driver not found, virtual microphone not embedded (run: make vendor)"
            exit 0
          fi
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -R "${SRC}/BaoboxInterpreter.driver" "${DEST}/"
          cp "${SRC}/BlackHole-LICENSE.txt" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BlackHole-LICENSE.txt"
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none \
              "${DEST}/BaoboxInterpreter.driver"
          fi

  # 纯逻辑单元测试：只编 Tests/ 与被测的纯逻辑源码，不链接 App、不设 TEST_HOST，由 xctest 直接加载，不启动 Baobox。
  # 要测别的纯逻辑，把那个目录加进 sources（它不能引用 App / 模块类型）。
  # - Core/CLIUsage：Claude Code / Codex 的用量统计
  # - Core/MeetingEngine + Modules/Meeting/Logic：会议引擎接口、会话的决策、meeting.md 的模型与排版、纪要提示词（docs/meeting/ENGINE.md §5）
  # - LiveTranslateMixing.swift：混音与说话人判定（本来就是纯的）
  BaoboxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Core/CLIUsage
      - path: Sources/Core/EventFile
      - path: Sources/Core/MeetingEngine
      - path: Sources/Modules/Meeting/Logic
      - path: Sources/Modules/LiveTranslate/LiveTranslateMixing.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baobox.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        # 测试包不需要签名身份：本地与 CI 一律 ad-hoc（Sign to Run Locally），xctest 照样加载。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
